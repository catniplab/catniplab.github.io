# Label vocabulary for the publications page.
# The bib refers to ids only (fields `themes` and `tags`); renaming a display
# name never touches the bib. Theme ids map to the ### sections of research.md.
# Tag ids are kebab-case and unique across facets.
themes:
  - id: inference
    name: Inference of effective dynamical systems
  - id: language
    name: Improving our language for neural computation
  - id: neurotech
    name: Neurotechnology for real-time experiments
  - id: integrative
    name: Integrative neuroscience
facets:
  - id: research      # sub-research areas
    name: Research topic
    tags:
      - {id: state-space-models, name: State-space models}
      - {id: latent-variable-models, name: Latent variable models}
      - {id: continuous-attractors, name: Continuous attractors}
      - {id: universal-approximation, name: Universal approximation}
      - {id: dynamical-archetypes, name: Dynamical archetypes}
      - {id: metastability, name: Metastability and multistability}
      - {id: oscillations, name: Oscillations and limit cycles}
      - {id: neural-network-theory, name: Theory of artificial neural networks}
      - {id: neural-coding, name: Neural coding and decoding}
      - {id: receptive-fields, name: Receptive field models}
      - {id: functional-connectivity, name: Functional connectivity}
      - {id: point-processes, name: Point processes and spike trains}
      - {id: entropy-estimation, name: Entropy estimation}
      - {id: neural-control, name: Control of neural dynamics}
      - {id: computational-neuroscience, name: Computational neuroscience}
  - id: area          # neuroscience areas
    name: Neuroscience area
    tags:
